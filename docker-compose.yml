services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudcost
      POSTGRES_PASSWORD: cloudcost
      POSTGRES_DB: cloudcost
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcost -d cloudcost"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://cloudcost:cloudcost@db:5432/cloudcost
      AUTO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
